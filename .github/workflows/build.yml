name: Build plugin
run-name: Build plugin · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish release vX.Y.Z from main, with the version in package.json.
        type: boolean
        default: false

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Backend tests and shell checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          shellcheck install.sh scripts/*.sh app/*.sh
          python3 -c 'import json; json.load(open("ports.json"))'

      - name: Godot cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/armada-ports-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('scripts/build-app.sh') }}

      - name: App build (linux-arm64) and check
        run: |
          set -euo pipefail
          bash scripts/build-app.sh
          bash scripts/check-app.sh

      - name: Frontend typecheck, build and package
        run: |
          set -euo pipefail
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          bash scripts/package.sh
          cp install.sh out/

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: ArmadaPorts-run-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

  # A pushed vX.Y.Z tag, or a manual run on main with "release" ticked, which creates the tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ArmadaPorts-run-${{ github.run_number }}
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="v$version"
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "$tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json ($tag)." >&2
              exit 1
          fi
          notes="notes/$tag.md"
          [[ -f $notes ]] || { echo "Write $notes first: it is the release's text." >&2; exit 1; }
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Armada Ports $version" --notes-file "$notes"
